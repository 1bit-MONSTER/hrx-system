rules:
  - id: amd-reference.no-library-vocabulary
    languages: [generic]
    severity: ERROR
    message: >-
      The AMD hardware reference is independent of libamdf APIs and CTS.
      Library contracts and test documentation belong with their owners.
    pattern-regex: '(?i)\b(?:libamdf|amdf_[a-z0-9_]+|cts)\b'
    paths:
      include:
        - /docs/reference/amd/**

  - id: amd-reference.no-local-implementation-links
    languages: [generic]
    severity: ERROR
    message: >-
      The AMD hardware reference cites native primary sources rather than local
      implementation, header, test, or working-note paths.
    pattern-regex: '(?i)(?:\]\(\s*<?|\]:[ \t]*<?)(?!(?:https?://|#))(?:[^()\s<>]*/)?(?:src|include|cts|\.notes)/[^()\s<>]*'
    paths:
      include:
        - /docs/reference/amd/**

  - id: libamdf.docs.no-cts-dependencies
    languages: [generic]
    severity: ERROR
    message: >-
      Library documentation describes the API independently of CTS, including
      experimental CTS. Test documentation may consume library documentation.
    pattern-regex: '(?i)\bcts\b'
    paths:
      include:
        - /libamdf/docs/**
        - /libamdf/README.md
